<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Payload Reader - Offline news reader for low-bandwidth environments">
    <meta name="theme-color" content="#ffffff">
    <title>ATLAS v.0.1</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
</head>
<body>
    <div id="app">
        <!-- Status Bar -->
        <header id="status-bar">
            <span id="app-name">ATLAS v.0.1</span>
            <span id="status-temp"><span id="top-temp">--</span>°C</span>
            <span id="signal-status"><span id="signal-indicator">---</span></span>
            <span id="sync-status">SYNC: <span id="last-sync">---</span></span>
        </header>

        <!-- Mission Control Dashboard -->
        <main id="dashboard">
            <!-- Multi-Timezone Clock -->
            <section id="clock-panel" class="panel collapsible collapsed">
                <h2 class="panel-title" data-toggle="clock-panel">
                    <span class="toggle-icon">+</span> CHRONOMETER
                </h2>
                <div id="clocks" class="panel-content"></div>
            </section>

            <!-- Weather Panel -->
            <section id="weather-panel" class="panel collapsible collapsed">
                <h2 class="panel-title" data-toggle="weather-panel">
                    <span class="toggle-icon">+</span> ATMOSPHERIC CONDITIONS
                </h2>
                <div class="panel-content">
                    <div id="weather-current">
                        <span id="weather-loading">ACQUIRING DATA...</span>
                    </div>
                    <div id="weather-forecast"></div>
                    <div id="weather-stale" class="warning hidden">STALE DATA</div>
                </div>
            </section>

            <!-- Article List -->
            <section id="articles-panel" class="panel">
                <h2 class="panel-title">TRANSMISSIONS</h2>
                <div id="transmissions-stats" class="hidden">
                    <span>ARTICLES: <span id="article-count">0</span></span>
                    <span>UNREAD: <span id="unread-count">0</span></span>
                </div>
                <div id="transmissions-body">
                    <div id="article-list"></div>
                    <div id="transmissions-controls">
                        <button id="sync-btn" class="btn">SYNC PAYLOAD</button>
                        <select id="filter-select" class="hidden">
                            <option value="all">ALL</option>
                            <option value="unread">UNREAD</option>
                            <option value="read">READ</option>
                        </select>
                    </div>
                </div>
            </section>
        </main>

        <!-- Article Detail View (hidden by default) -->
        <article id="article-detail" class="hidden">
            <header id="detail-header">
                <button id="back-btn" class="btn">< BACK</button>
                <button id="mark-read-btn" class="btn">MARK READ</button>
            </header>
            <h1 id="detail-title"></h1>
            <div id="detail-meta">
                <span id="detail-source"></span>
                <span id="detail-date"></span>
                <span id="detail-words"></span>
            </div>
            <div id="detail-content"></div>
        </article>

        <!-- Settings Modal (hidden by default) -->
        <div id="settings-modal" class="modal hidden">
            <div class="modal-content">
                <h2>SETTINGS</h2>
                <div id="timezone-settings">
                    <h3>TIME ZONES</h3>
                    <div id="timezone-list"></div>
                </div>
                <div id="weather-settings">
                    <h3>WEATHER LOCATION</h3>
                    <input type="text" id="weather-location" placeholder="City, Country">
                    <input type="text" id="weather-api-key" placeholder="OpenWeatherMap API Key">
                </div>
                <button id="save-settings" class="btn">SAVE</button>
                <button id="close-settings" class="btn">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/db.js"></script>
    <script src="js/clock.js"></script>
    <script src="js/weather.js"></script>
    <script src="js/feeds.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/app.js"></script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered:', reg.scope))
                    .catch(err => console.error('Service Worker registration failed:', err));
            });
        }
    </script>
</body>
</html>
